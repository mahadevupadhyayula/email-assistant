[project]
name = "email-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mahadev Upadhyayula", email = "mahadev.upadhyayula@monash.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "cryptography>=46,<47",
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-celery-beat>=2.9.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2,<2",
    "psycopg[binary]>=3.3.6",
    "uvicorn[standard]>=0.54.0",
    "whitenoise[brotli]>=6.11.0",
]

[project.scripts]
email-assistant = "email_assistant:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
exclude = ["accounts/migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "django_celery_beat.*", "dj_database_url", "environ"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "google.oauth2.*"]
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
